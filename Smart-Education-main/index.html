<!DOCTYPE html>
<html lang="fr" class="light scroll-smooth">

    <title>SmartEducation (SMED)</title>
    <link rel="icon" href="/images/Logo simple.png" />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Pinyon+Script&display=swap"

    />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1c74e9",
              "background-light": "#f6f7f8",
              "background-dark": "#111821",
              "text-light": "#111418",
              "text-dark": "#ffffff",
              "surface-light": "#ffffff",
              "surface-dark": "#1a232e",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
            transitionDuration: {
              '2000': '2000ms',
            }

        },
      };

    <style>
      body {
        font-family: 'Inter', sans-serif;
